<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://fcopxtbenksodfmobliq.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<title>الحضور الذكي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#fbf6ec;--card:#fff;--tx:#2a2112;--mu:#7d6f55;--pr:#b07208;--prt:#fff;--hn:#f4c05a;--hn2:#fdf0d0;--ok:#2f9e44;--bad:#e03131;--bd:#eadfc6}
:root[data-theme="dark"]{--bg:#16120b;--card:#221b10;--tx:#f3ead8;--mu:#b5a688;--pr:#e0a030;--prt:#1b1204;--hn:#c58a1b;--hn2:#2e2310;--bd:#3d3120;--ok:#51cf66;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:920px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.narrow{max-width:440px;margin:28px auto}
h2,h3{margin:0 0 10px;font-weight:600}
label{display:block;color:var(--mu);font-size:13px;margin:10px 0 3px}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
input[type=checkbox]{width:auto;margin-left:6px}
button{background:var(--pr);color:var(--prt);border:0;cursor:pointer;font-weight:600;width:auto;padding:10px 18px}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.bad{background:var(--bad);color:#fff}button.ok{background:var(--ok);color:#fff}
button:disabled{opacity:.6}
.full{width:100%;margin-top:14px}
.link{background:none;color:var(--pr);padding:4px;border:0;font-weight:500}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(90deg,var(--hn),var(--pr));color:#1b1204;border:0;flex-wrap:wrap}
.hd button{background:rgba(255,255,255,.35);color:#1b1204}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--bd);margin:6px 0 14px;overflow-x:auto}
.tabs button{background:none;color:var(--mu);border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 2px;font-weight:500}
.tabs button.on{color:var(--tx);border-bottom-color:var(--pr)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.mu{color:var(--mu);font-size:13px}.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--hn2);border:1px solid var(--bd)}
#tg{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;z-index:5;width:42px;height:42px;padding:0;border-radius:50%;background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:18px}
#toast{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%;text-align:center}
.cb{display:flex;align-items:center;margin:6px 0;color:var(--tx)}
</style>
</head>
<body>
<button id="tg" onclick="toggleTheme()" aria-label="theme"></button>
<div id="toast"></div>
<div class="wrap" id="app"><div class="card narrow">جاري التحميل...</div></div>

<script src="libs.js?v=8"></script>
<script src="main.js?v=8"></script>
</body>
</html>
